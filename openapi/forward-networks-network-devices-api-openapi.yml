      type: string
      enum:
      - LICENSE_EXHAUSTED
      - MISSING_SIGNATURE
      - DUPLICATE
      - PARSER_EXCEPTION
      - MODELING_EXCEPTION
      - UNSUPPORTED_VENDOR
      - UNSUPPORTED_DEVICE_TYPE
    DeviceFiles:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/DeviceFile'
    MissingDevices:
      type: object
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/MissingDevice'
    DeviceCollectionError:
      type: string
