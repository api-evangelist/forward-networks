            - Yada yada yada
      - $ref: '#/components/schemas/Attribution'
    OffsetIncrementExpression:
      type: object
      required:
      - operator
      properties:
        operator:
          type: string
          description: '"IDENTITY" means to add the number at `path` in the previous request’s response to the previous request’s

            offset value. "LENGTH" means to add the length of the array at `path` in the previous request’s response to

            the previous request’s offset value. "PLUS_ONE" means to simply add one to the previous request’s offset

            value.'
          examples:
          - LENGTH
          enum:
          - IDENTITY
          - LENGTH
          - PLUS_ONE
        path:
          type: array
          items:
            type: string
          description: 'JSON property name(s) that must be accessed, starting from the top level of the HTTP response, to reach the

            value or array needed to calculate the next offset value. Required if `operator` is "IDENTITY" or "LENGTH";

            absent otherwise.'
          examples:
          - - items
    NetworkEndpointsPatchRequest:
      type: object
      required:
      - names
      - update
      properties:
        names:
          type: array
          items:
            type: string
          description: The names of the endpoints to update
          examples:
          - - my-endpoint-01
            - my-endpoint-02
        update:
          $ref: '#/components/schemas/NetworkEndpointsPatch'
          description: The property updates to apply to the specified endpoints
          examples:
          - collect: true
            note: null
    NetworkEndpoints:
      type: object
      required:
      - endpoints
      properties:
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/NetworkEndpoint'
    SnmpEndpointProfile:
      allOf:
      - type: object
        required:
        - id
        properties:
          id:
            type: string
            description: System-assigned identifier of this endpoint profile. Always begins with "SNMP-".
            examples:
            - SNMP-5
      - $ref: '#/components/schemas/SnmpEndpointProfileDef'
    SourceConnectivityResult:
      type: object
      required:
      - startTime
      - endTime
      - savedAt
      properties:
        startTime:
          type: string
          description: When this connectivity test began, according to the Collector’s system clock.
          examples:
          - '2025-05-28T12:33:00.000Z'
        endTime:
          type: string
          description: When this connectivity test ended, according to the Collector’s system clock.
          examples:
          - '2025-05-28T12:33:33.333Z'
        savedAt:
          type: string
          description: 'When this connectivity test result was saved to the database, according to the server’s system

            clock.'
          examples:
          - '2025-05-28T12:34:56.789Z'
        error:
          $ref: '#/components/schemas/ConnectivityTestError'
          description: The error encountered during the test. Present if the test failed. Absent if the test passed.
          examples:
          - PING_FAILED
        errorPhase:
          type: string
          description: The test phase during which `error` was encountered. Present if `error` is present.
          examples:
          - CONNECTION
          enum:
          - CONNECTION
          - AUTHENTICATION
          - TYPE_DISCOVERY
          - SETUP
          - AUTHORIZATION
          - QUERY
        discoveredType:
          $ref: '#/components/schemas/ClassicDeviceType'
          description: The device type auto-discovered during the connectivity test.
          examples:
          - arista_eos_ssh
        discoveredCliCredentialId:
          type: string
          description: 'The `id` of the working CliCredential of type `LOGIN` auto-discovered during the connectivity test. Can only

            be present for device types collected via SSH.'
          examples:
          - L-3
        discoveredCliCredential2Id:
          type: string
          description: 'The `id` of the working CliCredential of type `PRIVILEGED_MODE` (for Cisco-like and Checkpoint devices) or

            `SHELL` (for Avi controllers) auto-discovered during the connectivity test. Can only be present for device

            types collected via SSH or Telnet.'
          examples:
          - PM-2
        discoveredCliCredential3Id:
          type: string
          description: 'The `id` of the working CliCredential of type `EXPERT_MODE` (for Checkpoint devices) auto-discovered during

            the connectivity test. Can only be present for device types collected via SSH.'
          examples:
          - EM-3
        discoveredHttpCredentialId:
          type: string
          description: 'The `id` of the working HttpCredential of type `LOGIN` or `API_KEY` auto-discovered during the connectivity

            test. Can only be present for device types collected via HTTPS.'
          examples:
          - H-5
        discoveredSnmpCredentialId:
          type: string
          description: The `id` of the working SnmpCredential auto-discovered during the connectivity test.
          examples:
          - S-1
        hostIps:
          type: array
          items:
            type: string
          description: 'The IP addresses to which `host` resolves if it’s a hostname. Contains just `host` itself if it’s an IP

            address.'
          examples:
          - - 10.121.7.13
        unauthorizedCommands:
          type: array
          items:
            type: string
          description: Commands that failed with an authorization (permission) error during the connectivity test.
          examples:
          - - show config
            - show interfaces status
    NetworkEndpointsPatch:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ConnectionType'
          description: 'The desired connection type for the specified network endpoints. Omit to leave this property

            alone.'
          examples:
          - CLI
        profileId:
          type: string
          description: 'ID of the endpoint profile to use. Auto-detected during connectivity testing if unspecified. Use `null` to

            clear. Omit to leave this property alone.'
          examples:
          - CLI-7
        protocol:
          $ref: '#/components/schemas/Protocol'
          description: 'The collection protocol to use. Defaults to SSH. Use `null` to clear. Omit to leave this

            property alone.'
          examples:
          - SSH
        credentialId:
          type: string
          description: 'The `id` of a CliCredential of type `LOGIN`. Credential auto-association will be attempted using credentials

            configured to allow it if this property is unspecified and collecting from this endpoint requires this kind

            of credential. Use `null` to clear. Omit to leave this property alone.'
          examples:
          - L-3
        jumpServerId:
          type: string
          description: 'The `id` of the JumpServer that should be used to collect from this device. Use `null` to clear. Omit to

            leave this property alone.'
          examples:
          - J-0
        collect:
          type: boolean
          description: 'Whether to collect from this network endpoint. Defaults to true. Use `null` to clear. Omit to leave this

            property alone.'
          examples:
          - true
        note:
          type: string
          description: 'An optional description or note about this network endpoint. Use `null` to clear. Omit to leave this

            property alone.'
          examples:
          - Yada yada yada
    OffsetBasedPagination:
      type: object
      required:
      - type
      - itemsArrayField
      - parameterName
      - offsetIncrementExpression
      properties:
        type:
          type: string
          const: OFFSET
        itemsArrayField:
          type: array
          items:
            type: string
          description: 'JSON property name(s) that must be accessed, starting from the top level of the HTTP response, to reach the

            paginated data array.'
          examples:
          - - items
        parameterName:
          type: string
          description: 'The name of the URL query parameter to populate with the offset value that increases with each

            request.'
          examples:
          - skip
        offsetIncrementExpression:
          $ref: '#/components/schemas/OffsetIncrementExpression'
          description: 'What to add to the previous request’s offset value to get the next request’s offset value. The first

            request’s offset value is always zero.'
          examples:
          - operator: LENGTH
            path:
            - items
        maxPages:
          type: integer
          format: int32
          description: Maximum number of pages to collect. Defaults to 1000.
          examples:
          - 100
    EndpointProfile:
      allOf:
      - type: object
        oneOf:
        - $ref: '#/components/schemas/CliEndpointProfile'
        - $ref: '#/components/schemas/SnmpEndpointProfile'
        - $ref: '#/components/schemas/HttpEndpointProfile'
        discriminator:
          propertyName: type
          mapping:
            CLI: '#/components/schemas/CliEndpointProfile'
            SNMP: '#/components/schemas/SnmpEndpointProfile'
            HTTP: '#/components/schemas/HttpEndpointProfile'
      - $ref: '#/components/schemas/Attribution'
    HttpNetworkEndpoint:
      allOf:
      - type: object
        required:
        - type
        - name
        - host
        properties:
          type:
            type: string
            const: HTTP
          name:
            type: string
            description: 'A name that’s unique (ignoring case) among all of the network’s collection source names. May consist of

              letters, digits, dots, hyphens, and underscores.'
            examples:
            - my-endpoint
          host:
            type: string
            description: IP address or hostname used to connect to the device.
            examples:
            - 10.121.7.13
          port:
            type: integer
            format: int32
            minimum: 1
            maximum: 65535
            description: 'Port used to connect to the device. The default value depends on the collection protocol: 22 for SSH, 443

              for HTTPS, etc.'
            examples:
            - 22
          profileId:
            type: string
            description: ID of the endpoint profile to use. Auto-detected during connectivity testing if unspecified.
            examples:
            - HTTP-4
          credentialId:
            type: string
            description: 'The `id` of an HttpCredential. The type of the credential must match the HttpAuthStrategy of the endpoint’s

              assigned or discovered profile (see `authType` in HttpEndpointProfileDef). Credential auto-association will

              be attempted using credentials configured to allow it if this property is unspecified and collecting from

              this endpoint requires this kind of credential.'
            examples:
            - H-5
          disableSslValidation:
            type: boolean
            description: 'Whether to skip TLS validation. Can be useful for an endpoint whose certificate isn’t trusted. Not

              recommended. Defaults to false.'
            examples:
            - false
          collect:
            type: boolean
            description: Whether to collect from this network endpoint. Defaults to true.
            examples:
            - true
          note:
            type: string
            description: An optional description or note about this network endpoint.
            examples:
            - Yada yada yada
      - $ref: '#/components/schemas/Attribution'
    NewCliNetworkEndpoint:
      type: object
      required:
      - type
      - name
      - host
      properties:
        type:
          type: string
          const: CLI
        name:
          type: string
          description: 'A name that’s unique (ignoring case) among all of the network’s collection source names. May consist of

            letters, digits, dots, hyphens, and underscores.'
          examples:
          - my-endpoint
        host:
          type: string
          description: IP address or hostname used to connect to the device.
          examples:
          - 10.121.7.13
        port:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
          description: 'Port used to connect to the device. The default value depends on the collection protocol: 22 for SSH, 443

            for HTTPS, etc.'
          examples:
          - 22
        protocol:
          type: string
          description: The collection protocol to use. Defaults to SSH.
          examples:
          - SSH
          enum:
          - SSH
          - TELNET
        profileId:
          type: string
          description: ID of the endpoint profile to use. Auto-detected during connectivity testing if unspecified.
          examples:
          - CLI-7
        credentialId:
          type: string
          description: 'The `id` of a CliCredential of type `LOGIN`. Credential auto-association will be attempted using credentials

            configured to allow it if this property is unspecified and collecting from this endpoint requires this kind

            of credential.'
          examples:
          - L-3
        jumpServerId:
          type: string
          description: The `id` of the JumpServer that should be used to collect from this device.
          examples:
          - J-0
        fullCollectionLog:
          type: boolean
          description: Enables more detailed logging during collection. Defaults to false.
          examples:
          - false
        largeRtt:
          type: boolean
          description: Whether the device has a large round-trip time (requires a longer response timeout).
          examples:
          - false
        collect:
          type: boolean
          description: Whether to collect from this network endpoint. Defaults to true.
          examples:
          - true
        note:
          type: string
          description: An optional description or note about this network endpoint.
          examples:
          - Yada yada yada
    CliEndpointProfilePatch:
      type: object
      properties:
        name:
          type: string
          description: Name of this profile ("HpPrinter", "SamsungTV", etc.). Omit to leave this property alone.
          examples:
          - sentry_pdu_ssh
        detectorCommand:
          type: string
          description: 'CLI command to run to detect a network endpoint of this type. If absent, the profile can be manually

            assigned to a network endpoint, but not auto-detected. Use `null` to clear. Omit to leave this property

            alone.'
          examples:
          - version
        detectorPatterns:
          type: array
          items:
            type: string
          description: 'Patterns matching on output of `detectorCommand` to determine whether the device is of this type. Absent if

            `detectorCommand` is absent. Never empty. Use `null` to clear. Omit to leave this property alone.'
          examples:
          - - Sentry Switched PDU
        detectorErrorPatterns:
          type: array
          items:
            type: string
          description: 'Patterns matching an error message if a device doesn’t recognize `detectorCommand`. Use `null` to clear.

            Omit to leave this property alone.'
          examples:
          - - Invalid command
            - 'Switched PDU commands:'
        nameDetectorCommand:
          type: string
          description: 'Command to use to detect the name of a network endpoint of this type. If absent, the name cannot be

            detected. Use `null` to clear. Omit to leave this property alone.'
          examples:
          - show network
        nameDetectorPatterns:
          type: array
          items:
            type: string
          description: 'Glob patterns used to extract the device name from the output of `nameDetectorCommand`. The word immediately

            after a matched glob pattern is the desired name. If no glob patterns are specified, the first word/token in

            the `nameDetectorCommand` output will be used. Use `null` to clear. Omit to leave this property alone.'
          examples:
          - - FQDN:*enabled
        prompt:
          type: string
          description: 'A case-insensitive glob pattern used to identify an interactive console menu prompt. When this pattern

            matches the end of the prompt, ignoring any trailing whitespace, the Collector will enter the configured

            `promptResponse`. Use `null` to clear. Omit to leave this property alone.'
          examples:
          - y/n
        promptResponse:
          type: string
          description: 'What the Collector should enter in response to an interactive console menu prompt matching `prompt` in order

            to proceed. Required if `prompt` is set. Use `null` to clear. Omit to leave this property alone.'
          examples:
          - y
        pagePrompt:
          type: string
          description: 'Case-insensitive glob pattern used to identify a new page banner. Works like `prompt`. If the device doesn’t

            generate paginated command output or if paging is like the “more” command, omit this property. Use `null` to

            clear. Omit to leave this property alone.'
          examples:
          - continue\?
        pagePromptResponse:
          type: string
          description: 'What the Collector should enter in response to an interactive pagination prompt detected via `pagePrompt` in

            order to proceed. Required if `pagePrompt` is set. Use `null` to clear. Omit to leave this property alone.'
          examples:
          - c
        ptyType:
          type: string
          description: 'Device’s terminal type ("xterm-256color", "vt100", etc.). Use `null` to clear. Omit to leave this property

            alone.'
          examples:
          - vt100
        ptyColumnSize:
          type: integer
          format: int32
          description: 'Column size of the output. Defaults to 500. Use `null` to clear. Omit to leave this property

            alone.'
          examples:
          - 240
        clearPrompt:
          type: string
          description: 'Command to clear the prompt. Can be specified like "ctrl-[a-z]" or "ctrl+[a-z]". Defaults to "ctrl+c". Use

            `null` to clear. Omit to leave this property alone.'
          examples:
          - ctrl+z
        responseTimeoutSec:
          type: integer
          format: int32
          description: 'Timeout in seconds applied to this profile’s CLI commands run during discovery and collection. Use `null` to

            clear. Omit to leave this property alone.'
          examples:
          - 15
        commandSets:
          type: array
          items:
            $ref: '#/components/schemas/CommandSet'
          description: 'Predefined command sets to run on network endpoints with this profile. The "UNIX" set includes the commands

            "ifconfig", "netstat -ln", "hostname", and "uname -a". Use `null` to clear. Omit to leave this property

            alone.'
          examples:
          - - UNIX
        customCommands:
          type: array
          items:
            type: string
          description: 'Additional commands to run on network endpoints with this profile. Commands should be read-only. Use `null`

            to clear. Omit to leave this property alone.'
          examples:
          - - uptime
            - iptables -L
