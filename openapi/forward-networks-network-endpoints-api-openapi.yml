          - Yada yada yada
    SnmpEndpointProfilePatch:
      type: object
      properties:
        name:
          type: string
          description: Name of this profile ("HpPrinter", "SamsungTV", etc.). Omit to leave this property alone.
          examples:
          - esxi_snmp
        detectorOid:
          type: string
          description: 'OID to collect to detect a network endpoint of this type. If absent, the profile can be manually assigned to

            a network endpoint, but not auto-detected. Use `null` to clear. Omit to leave this property alone.'
          examples:
          - 1.3.6.1.2.1.1.1.0
        detectorPatterns:
          type: array
          items:
            type: string
          description: 'Patterns matching on output of `detectorOid` to determine whether the device is of this type. Absent if

