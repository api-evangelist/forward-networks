            application/json:
              schema:
                $ref: '#/components/schemas/EncryptorList'
      security:
      - api_token: []
    put:
      tags:
      - Synthetic Devices
      summary: Replace all of a network’s encryptors
      operationId: putEncryptors
      parameters:
      - name: networkId
        in: path
        required: true
        schema:
          type: string
      requestBody:
