openapi: 3.2.0
info:
  title: 'Forward Networks: Complete Aliases Synthetic Devices API'
  description: Model and verify networks
  contact:
    email: support@forwardnetworks.com
  license:
    name: MIT
    url: https://spdx.org/licenses/MIT
  version: '26.6'
servers:
- url: /api
tags:
- name: Synthetic Devices
