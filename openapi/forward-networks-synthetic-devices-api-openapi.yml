                $ref: '#/components/schemas/SyntheticConnections'
      security:
      - api_token: []
  /networks/{networkId}/wan-circuits:
    get:
      tags:
      - Synthetic Devices
      summary: Get a network’s WAN circuits
      operationId: getWanCircuits
      parameters:
      - name: networkId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WanCircuitList'
      security:
      - api_token: []
    put:
      tags:
      - Synthetic Devices
      summary: Replace all of a network’s WAN circuits
      operationId: putWanCircuits
      parameters:
      - name: networkId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WanCircuitList'
        required: true
      responses:
        '204':
          description: No Content
          content: {}
      security:
      - api_token: []
  /networks/{networkId}/wan-circuits/{wanCircuitName}:
    get:
      tags:
      - Synthetic Devices
      summary: Get a WAN circuit
      operationId: getWanCircuit
      parameters:
      - name: networkId
        in: path
        required: true
        schema:
          type: string
      - name: wanCircuitName
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WanCircuit'
      security:
      - api_token: []
    put:
      tags:
      - Synthetic Devices
      summary: Add or replace a WAN circuit
      operationId: putWanCircuit
      parameters:
      - name: networkId
        in: path
        required: true
        schema:
          type: string
      - name: wanCircuitName
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WanCircuit'
        required: true
      responses:
        '204':
          description: No Content
          content: {}
      security:
      - api_token: []
    patch:
      tags:
      - Synthetic Devices
      summary: Update a WAN circuit
      description: 'All JSON properties in the request body are optional. Include only the properties you wish to

        change.'
      operationId: patchWanCircuit
      parameters:
      - name: networkId
        in: path
        required: true
        schema:
          type: string
      - name: wanCircuitName
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WanCircuitPatch'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WanCircuit'
      security:
      - api_token: []
    delete:
      tags:
      - Synthetic Devices
      summary: Remove a WAN circuit
      operationId: deleteWanCircuit
      parameters:
      - name: networkId
        in: path
        required: true
        schema:
          type: string
      - name: wanCircuitName
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
          content: {}
      security:
      - api_token: []
components:
  schemas:
    Encryptor:
      type: object
      required:
      - name
      - siteConnection
      - tunnels
      properties:
        name:
          type: string
          examples:
          - encryptor
        siteConnection:
          $ref: '#/components/schemas/EncryptorConnection'
          description: A connection to a high site
        underlayConnection:
          $ref: '#/components/schemas/EncryptorConnection'
          description: A connection to the underlay network (a low site)
        tunnels:
          type: array
          items:
            $ref: '#/components/schemas/EncryptorTunnel'
          description: 'Tunnels to other encryptor devices. A tunnel source address is modeled as residing on this device and the

            destination addresses on another encryptor device. A source address may be reused on an encryptor. Each

            destination address must match the source address of the tunnel on another encryptor, and vice-versa'
        subnets:
          type: array
          items:
            type: string
          description: 'Subnets to route to the high site, in addition to the source addresses of tunnels on the `siteConnection`

            gateway device'
    L3VpnPatch:
      type: object
      properties:
        name:
          type: string
        connections:
          type: array
          items:
            $ref: '#/components/schemas/L3SyntheticWanConnection'
          description: If specified, this list will **replace** all existing connections on the L3 VPN node.
    DevicePort:
      type: object
      properties:
        device:
          type: string
        port:
          type: string
    SyntheticConnection:
      type: object
      properties:
        name:
          type: string
    L2VpnConnection:
      type: object
      required:
      - device
      - port
      properties:
        device:
          type: string
          description: The customer edge device.
        port:
          type: string
          description: The physical edge port on the customer edge device.
          examples:
          - eth1/1
        vlan:
          type: integer
          format: int32
          examples:
          - 100
        name:
          type: string
          description: 'An optional name for this connection, which will be used as the interface name created on the synthetic

            device that links to the customer edge device.'
    L2Vpn:
      type: object
      required:
      - name
      - connections
      properties:
        name:
          type: string
          examples:
          - l2vpn
        connections:
          type: array
          items:
            $ref: '#/components/schemas/L2VpnConnection'
    InternetNodePatch:
      type: object
      properties:
        connections:
          type: array
          items:
            $ref: '#/components/schemas/L3SyntheticWanConnection'
          description: If specified, this list will **replace** all existing connections on the internet node.
        name:
          type: string
        translations:
          type: array
          items:
            $ref: '#/components/schemas/SyntheticNatEntry'
          description: If specified, this list will **replace** all existing translations on the internet node.
        subnetsToExclude:
          type: array
          items:
            type: string
          description: If specified, this list will **replace** all existing excluded subnets on the internet node.
    EncryptorConnection:
      type: object
      required:
      - uplinkPort
      properties:
        uplinkPort:
          $ref: '#/components/schemas/DevicePort'
          description: The physical uplink port on the edge device.
          examples:
          - device: nyc-rtr-01
            port: eth1/1
        gatewayPort:
          $ref: '#/components/schemas/DevicePort'
          description: The virtual gateway port, if different than `uplinkPort`.
          examples:
          - device: nyc-rtr-01
            port: vlan100
        vlan:
          type: integer
          format: int32
          description: The VLAN of traffic from `uplinkPort`, if tagged.
          examples:
          - 100
        name:
          type: string
          description: 'An optional name for this connection, which will be used as the interface name created on the synthetic

            device that links to the physical edge port.'
    WanCircuit:
      type: object
      required:
      - name
      - connection1
      - connection2
      properties:
        name:
          type: string
          examples:
          - wan-circuit-01
        connection1:
          $ref: '#/components/schemas/WanCircuitConnection'
        connection2:
          $ref: '#/components/schemas/WanCircuitConnection'
    WanCircuitConnection:
      type: object
      required:
      - device
      - port
      properties:
        device:
          type: string
          description: A customer edge device name
        port:
          type: string
          description: The name of the connected port on `device`
        vlan:
          type: integer
          format: int32
          description: The VLAN of traffic from `port`, if tagged
          examples:
          - 100
        name:
          type: string
          description: 'An optional name for this connection, which will be used as the interface name created on the synthetic

            device that links to the edge device.'
    L3VpnList:
      type: object
      required:
      - l3Vpns
      properties:
        l3Vpns:
          type: array
          items:
            $ref: '#/components/schemas/L3Vpn'
    IntranetNodePatch:
      type: object
      properties:
        connections:
          type: array
          items:
            $ref: '#/components/schemas/L3SyntheticWanConnection'
          description: If specified, this list will **replace** all existing connections on the intranet node.
        name:
          type: string
    WanCircuitPatch:
      type: object
      properties:
        name:
          type: string
          examples:
          - wan-circuit-01
        connection1:
          $ref: '#/components/schemas/WanCircuitConnection'
        connection2:
          $ref: '#/components/schemas/WanCircuitConnection'
    SyntheticNatEntry:
      type: object
      required:
      - insideAddress
      - outsideAddress
      properties:
        insideAddress:
          type: string
          examples:
          - 10.0.0.1
        outsideAddress:
          type: string
          description: A public (non-RFC1918) address
          examples:
          - 1.1.1.1
    L2VpnList:
      type: object
      required:
      - l2Vpns
      properties:
        l2Vpns:
          type: array
          items:
            $ref: '#/components/schemas/L2Vpn'
    AutoDiscoverySource:
      type: string
      enum:
      - NONE
      - IP_ROUTES
      - BGP_ROUTES
      - INTERFACE_ADDRESSES
    EncryptorList:
      type: object
      required:
      - encryptors
      properties:
        encryptors:
          type: array
          items:
            $ref: '#/components/schemas/Encryptor'
    IntranetNode:
      type: object
      required:
      - name
      - connections
      properties:
        name:
          type: string
          examples:
          - inet
        connections:
          type: array
          items:
            $ref: '#/components/schemas/L3SyntheticWanConnection'
    EncryptorTunnel:
      type: object
      required:
      - source
      - destination
      properties:
        source:
          type: string
          description: Source IP address of an encryptor tunnel
          examples:
          - 1.1.1.1
        destination:
          type: string
          description: Destination IP address of an encryptor tunnel
          examples:
          - 2.2.2.2
    L2VpnPatch:
      type: object
      properties:
        connections:
          type: array
          items:
            $ref: '#/components/schemas/L2VpnConnection'
          description: If specified, this list will **replace** all existing connections on the L2 VPN node.
        name:
          type: string
    L3SyntheticWanConnection:
      type: object
      required:
      - uplinkPort
      properties:
        uplinkPort:
          $ref: '#/components/schemas/DevicePort'
          description: The physical uplink port on the edge device.
          examples:
          - device: nyc-rtr-01
            port: eth1/1
        gatewayPort:
          $ref: '#/components/schemas/DevicePort'
          description: The virtual gateway port, if different than `uplinkPort`.
          examples:
          - device: nyc-rtr-01
            port: vlan100
        vlan:
          type: integer
          format: int32
          description: The VLAN of traffic from `uplinkPort`, if tagged.
          examples:
          - 100
        name:
          type: string
          description: 'An optional name for this connection, which will be used as the interface name created on the synthetic

            device that links to the physical edge port.'
        vrf:
          type: string
          description: An optional name for the VRF on the synthetic device under which this connection resides.
        site:
          type: string
          description: 'An optional name for the site in which this connection''s gateway device resides. A site is a collection of

            devices that redistribute routes learned from the synthetic device to each other. Grouping connections

            together into a single site enables more accurate site subnet autodiscovery when using `IP_ROUTES` or

            `BGP_ROUTES`.'
        subnets:
          type: array
          items:
            type: string
          description: 'Advertised subnets. Routes for these subnets are created on the synthetic device if received by another CE.

            Required (and must not be empty) if `subnetAutoDiscovery` is `NONE`.'
          examples:
          - - 123.223.47.0/24
        subnetAutoDiscovery:
          $ref: '#/components/schemas/AutoDiscoverySource'
          description: 'The types of routes from which advertised subnets are automatically inferred in the gateway device’s routing

            table. Defaults to `NONE`. If `INTERFACE_ADDRESSES`, the gateway port’s IP address is used. If `IP_ROUTES`,

            subnets are inferred from the gateway device’s RIB. If `BGP_ROUTES`, subnets are inferred from the gateway

            device’s Adj-RIB-Out.


            Note: If not `NONE`, routes are created on the synthetic device for both autodiscovered subnets, as well any

            subnets specified in `subnets`, that are received by another CE.


            Note: Using `BGP_ROUTES` will automatically enable collection of Adj-RIB-Out from the gateway device in

            future network collections.'
          examples:
          - NONE
        peerIps:
          type: array
          items:
            type: string
          description: 'IP addresses of BGP peers to which this connection’s site subnets are advertised. If empty, routes

            advertised to all BGP peers are examined.


            Note: This set is only used if `subnetAutoDiscovery` is `BGP_ROUTES`.'
          examples:
          - - 1.1.1.1
        backdoorLinkPorts:
          type: array
          items:
            $ref: '#/components/schemas/DevicePort'
          description: L3 interfaces that provide backdoor connectivity between sites.
        advertisesDefaultRoute:
          type: boolean
          description: 'Whether the CE advertises the default route. Defaults to `false`.


            Note: This property is only used if `subnetAutoDiscovery` is `IP_ROUTES`, which should be the case when BGP

            collection is not enabled on the CE. If the Adj-RIB-Out is not collected, the RIB is examined and a default

            route forwarded out `gatewayPort` is skipped if this property is false.'
    IntranetNodeList:
      type: object
      required:
      - intranetNodes
      properties:
        intranetNodes:
          type: array
          items:
            $ref: '#/components/schemas/IntranetNode'
    L3Vpn:
      type: object
      required:
      - name
      - connections
      properties:
        name:
          type: string
          examples:
          - l3vpn
        connections:
          type: array
          items:
            $ref: '#/components/schemas/L3SyntheticWanConnection'
    WanCircuitList:
      type: object
      properties:
        wanCircuits:
          type: array
          items:
            $ref: '#/components/schemas/WanCircuit'
    SyntheticConnections:
      type: object
      properties:
        connections:
          type: array
          items:
            $ref: '#/components/schemas/SyntheticConnection'
    EncryptorPatch:
      type: object
      properties:
        name:
          type: string
        siteConnection:
          $ref: '#/components/schemas/EncryptorConnection'
        underlayConnection:
          $ref: '#/components/schemas/EncryptorConnection'
        tunnels:
          type: array
          items:
            $ref: '#/components/schemas/EncryptorTunnel'
          description: If specified, this list will **replace** all existing tunnels on the encryptor.
        subnets:
          type: array
          items:
            type: string
          description: If specified, this set will **replace** all existing subnets on the encryptor.
    InternetNode:
      type: object
      required:
      - name
      - connections
      properties:
        name:
          type: string
          examples:
          - inet
        connections:
          type: array
          items:
            $ref: '#/components/schemas/L3SyntheticWanConnection'
        translations:
          type: array
          items:
            $ref: '#/components/schemas/SyntheticNatEntry'
        subnetsToExclude:
          type: array
          items:
            type: string
          description: Public subnets that should not be located at this device.
  securitySchemes:
    api_token:
      type: http
      scheme: basic
