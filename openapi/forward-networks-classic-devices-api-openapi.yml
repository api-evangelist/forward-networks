            Relevant for devices collected via SSH or Telnet. Required if `prompt` is set. Use `null` to clear. Omit to

            leave the property alone.'
          examples:
          - y
        collect:
          type: boolean
          description: 'Whether to collect from the device. Defaults to true. Use `null` to clear. Omit to leave the

            property alone.'
          examples:
          - false
        note:
          type: string
          description: 'An optional description or note about the device. Use `null` to clear. Omit to leave the

            property alone.'
        enableSnmpCollection:
          type: boolean
          description: 'Whether to collect performance data (counters) via SNMP. Defaults to false. Use `null` to clear. Omit to

            leave the property alone.'
          examples:
          - false
        highCpuUsage:
          type: number
          format: float
