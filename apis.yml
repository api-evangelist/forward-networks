aid: forward-networks
name: Forward Networks
description: >-
  Forward Networks builds network digital-twin software (Forward Enterprise) that creates a
  mathematically accurate, vendor-agnostic model of large hybrid and multi-cloud networks. Networking,
  security, cloud, and compliance teams use it to verify network behavior before and after changes,
  trace packet paths, run automated policy checks, analyze CVE/vulnerability exposure, and query the
  network as structured data through the Network Query Engine (NQE). The Forward Enterprise Complete API
  is an OpenAPI 3.2.0 surface of 189 operations across 108 paths — covering Networks, Snapshots, Checks,
  Path Search, NQE, Vulnerability Analysis, and system administration — secured with HTTP Basic
  authentication and complemented by a Go client, a Terraform provider, and an open-source MCP server.
